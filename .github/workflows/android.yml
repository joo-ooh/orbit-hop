# Builds the Android app on every push to main (or by hand from the Actions tab).
#
# Outputs, under the run's "Artifacts":
#   orbit-hop-test-apk      test build (operator mode ON), install it on your phone to play
#   orbit-hop-release-aab   store build (operator mode OFF) for Google Play, only when the upload key secrets are set
#
# Upload key secrets (Settings > Secrets and variables > Actions), see RELEASE-ANDROID.md:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      ORBITHOP_VERSION_CODE: ${{ github.run_number }}
      OUT_DIR: ${{ github.workspace }}/dist
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Prepare upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ORBITHOP_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          ORBITHOP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORBITHOP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORBITHOP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if ! bash scripts/ci-android.sh 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            # post the important lines as an annotation, readable on the run page without opening the log
            lines=$( (grep -E -A10 "What went wrong|error:|^e: |Error:|ERROR" "$RUNNER_TEMP/build.log" | head -40; echo '--- last lines ---'; tail -25 "$RUNNER_TEMP/build.log") )
            echo "::error title=Android build failed::$(printf '%s' "$lines" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: orbit-hop-test-apk
          path: dist/orbit-hop-test.apk

      - uses: actions/upload-artifact@v4
        if: env.ORBITHOP_KEYSTORE != ''
        with:
          name: orbit-hop-release-aab
          path: dist/orbit-hop-*.aab
