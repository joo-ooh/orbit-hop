# Builds the Android app on every push to main (or by hand from the Actions tab).
#
# Outputs, under the run's "Artifacts":
#   orbit-hop-test-apk      test build (operator mode ON), install it on your phone to play
#   orbit-hop-release-aab   store build (operator mode OFF) for Google Play, only when the upload key secrets are set
#
# Upload key secrets (Settings > Secrets and variables > Actions), see RELEASE-ANDROID.md:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      ORBITHOP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # installs the Android SDK command-line tools and accepts the licenses; Gradle fetches the rest
      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Gradle helper
        run: |
          # on failure, post Gradle's error lines as an annotation (visible on the run page without opening logs)
          cat > "$RUNNER_TEMP/gradle.sh" <<'SH'
          #!/usr/bin/env bash
          set -o pipefail
          cd android
          if ! ./gradlew --no-daemon "$@" 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            summary=$(grep -E -A12 "What went wrong|error:|^e: |FAILURE" "$RUNNER_TEMP/gradle.log" | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Gradle $*::${summary}"
            exit 1
          fi
          SH
          chmod +x "$RUNNER_TEMP/gradle.sh"

      - name: Test APK (operator mode on)
        run: |
          npm run build:dev
          npx cap sync android
          "$RUNNER_TEMP/gradle.sh" assembleDebug
          cd android
          mv app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/orbit-hop-test.apk"

      - name: Prepare upload key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "path=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"
          else
            echo "No upload key secrets yet: skipping the Google Play bundle."
          fi

      - name: Store bundle for Google Play (operator mode off)
        if: steps.key.outputs.path != ''
        env:
          ORBITHOP_KEYSTORE: ${{ steps.key.outputs.path }}
          ORBITHOP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORBITHOP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORBITHOP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npm run build
          npx cap sync android
          "$RUNNER_TEMP/gradle.sh" bundleRelease
          cd android
          mv app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/orbit-hop-${{ github.run_number }}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: orbit-hop-test-apk
          path: ${{ runner.temp }}/orbit-hop-test.apk

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.path != ''
        with:
          name: orbit-hop-release-aab
          path: ${{ runner.temp }}/orbit-hop-*.aab
